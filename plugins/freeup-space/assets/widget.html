<body><main><header><div class="brand"><div class="mark" aria-hidden="true">◫</div><div><h1>Freeup Space</h1><small>Choose what stays. Clear what you no longer need.</small></div></div><span class="badge">Recoverable cleanup</span></header><div id="error" role="alert" hidden></div><div id="app" aria-live="polite"><p class="muted">Connecting to Freeup Space…</p></div></main>
<script>
"use strict";
const $=s=>document.querySelector(s), app=$("#app");
let state=null, selected=new Map(), category="", offset=0, query="", editing=false, busy=false, timer=null, aiSent=false, mode="quick", roots="";
let similarGroup="", groupOffset=0, previewOffset=0, previewToken=null, savedIds=new Set(), savedSelectionDigest;
const pending=new Map();let sequence=0, bridgeReady=false, restoring=false, needsReconnect=true, saveQueue=Promise.resolve();
function savedChoices(view){const r=view.review_state||{};selected=new Map((view.selected_candidates||[]).map(c=>[c.candidate_id,c]));category=r.category||"";query=r.query||"";offset=r.offset||0;similarGroup=r.similar_group||"";groupOffset=r.group_offset||0;savedIds=new Set(selected.keys());savedSelectionDigest=r.selection_digest;}
function saveChoices(){
if(state?.status!=="review"||state.closed)return Promise.resolve();
const wanted=new Set(selected.keys()), filters={plan_digest:state.plan_digest,category,query,offset,similar_group:similarGroup,group_offset:groupOffset};
const remember=result=>{const r=extract(result).review_state;savedIds=new Set(r.ids);savedSelectionDigest=r.selection_digest;return result;};
const save=saveQueue.then(async()=>{
 // Clearing everything needs one small request, even for very large groups.
 if(!wanted.size&&savedIds.size)return remember(await call("save_review_state",{...filters,ids:[]}));
 const added=[...wanted].filter(id=>!savedIds.has(id)),removed=[...savedIds].filter(id=>!wanted.has(id));let result;
 for(let i=0;i<Math.max(added.length,removed.length,1);i+=500){result=remember(await call("save_review_state",{...filters,add_ids:added.slice(i,i+500),remove_ids:removed.slice(i,i+500),selection_digest:savedSelectionDigest}));}
 return result;
});saveQueue=save.catch(()=>{});return save;}
async function selectSimilar(groupId,action="select"){busy=true;render();try{await saveChoices();const result=await call("select_similar_group",{group_id:groupId,action,plan_digest:state.plan_digest});savedChoices(extract(result));accept(result);}finally{busy=false;render();}}
async function showGroup(group){similarGroup=group.group_id;category="";query="";offset=0;await changePage();$(".group-files")?.scrollIntoView({block:"start"});}
async function changePage(){await saveChoices();await refresh();}
async function reopen(){const result=await call("open_widget",{workspace:state.workspace});restore(result);}
async function closeWidget(){await saveChoices();await saveQueue;accept(await call("dismiss_widget"));if(window.openai?.requestClose)await window.openai.requestClose();}
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function append(parent,...nodes){for(const node of nodes)parent.append(node);return parent}
function button(text,action,primary=false,disabled=false){const n=el("button",text,primary?"primary":"");n.type="button";n.disabled=disabled||busy;n.onclick=()=>guard(action);return n}
function bytes(value=0){let n=value, i=0;const u=["B","KiB","MiB","GiB","TiB"];while(n>=1024&&i<4){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function title(value){return ({cache:"Caches",archive:"Archives",installer:"Installers",duplicate:"Duplicates","old-file":"Older files","developer-artifact":"Developer artifacts",log:"Logs",temporary:"Temporary files","system-managed":"System-managed storage",unclassified:"Other findings"})[value]||value.replaceAll("-"," ")}
function error(message){const n=$("#error");n.className="error";n.textContent=message;n.hidden=!message}
async function guard(fn){try{error("");await fn()}catch(e){error(e.message||String(e));busy=false;render()}}
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++sequence;const timeout=setTimeout(()=>{pending.delete(id);reject(new Error("The host did not respond. Reopen the widget or retry."))},120000);pending.set(id,{resolve,reject,timeout});parent.postMessage({jsonrpc:"2.0",id,method,params},"*")})}
function extract(result){return result?._meta?.widget||result?.widget||result?.call_tool_result?._meta?.widget||result?.mcp_tool_result?._meta?.widget}
function accept(result){const view=extract(result);if(view){if(state?.run_id!==view.run_id||state?.status==="loading"&&view.status!=="loading")savedChoices(view);const sameReview=state&&(state.status==="review"||state.status==="preview"&&editing)&&state.status===view.status&&state.closed===view.closed&&state.error===view.error&&state.plan_digest===view.plan_digest&&state.category===view.category&&state.offset===view.offset&&state.query===view.query&&state.similar_group===view.similar_group&&state.group_offset===view.group_offset;state=view;if(sameReview)renderAI();else render();schedule()} }
// A tool notification can replay the original open_widget snapshot after remount.
// Use its private session credentials to fetch live state before enabling controls.
function restore(result){const view=extract(result);if(!view)return;
if(!state||state.session_id!==view.session_id){state=view;selected.clear();category="";offset=0;query="";similarGroup="";groupOffset=0;needsReconnect=true}
void reconnect();}
async function reconnect(){if(!state||restoring||!(bridgeReady||window.openai?.callTool))return;
restoring=true;needsReconnect=true;clearTimeout(timer);render();
try{await saveQueue;await refresh();savedChoices(state);if(state.status==="review")await refresh();needsReconnect=false;error("")}
catch(e){needsReconnect=true;clearTimeout(timer);error(e.message||String(e))}
finally{restoring=false;render()}}
window.addEventListener("pageshow",()=>void reconnect());
document.addEventListener("visibilitychange",()=>{if(!document.hidden)void reconnect()});
window.addEventListener("message",event=>{if(event.source!==parent)return;const data=event.data;if(!data||data.jsonrpc!=="2.0")return;
if(data.id!==undefined&&pending.has(data.id)){const p=pending.get(data.id);pending.delete(data.id);clearTimeout(p.timeout);data.error?p.reject(new Error(data.error.message)):p.resolve(data.result);return}
if(data.method==="ui/notifications/tool-result")restore(data.params);
if(data.method==="ui/notifications/tool-cancelled")error("The host cancelled this request. Your files have not been approved for a new operation.");
if(data.method==="ui/resource-teardown"){clearTimeout(timer);parent.postMessage({jsonrpc:"2.0",id:data.id,result:{}},"*")}
});
window.addEventListener("openai:set_globals",event=>{const g=event.detail?.globals;restore(g?.toolResponseMetadata);if(!state)restore(window.openai?.toolResponseMetadata)});
async function call(name,args={}){const params={...args};if(state&&name!=="open_widget")Object.assign(params,{session_id:state.session_id,key:state.key});
const result=bridgeReady?await rpc("tools/call",{name,arguments:params}):await window.openai.callTool(name,params);
if(result?.isError)throw new Error(result.content?.filter(c=>c.type==="text").map(c=>c.text).join("\n")||"Operation failed");return result}
async function refresh(){let result=await call("scan_status",{category,offset,query,similar_group:similarGroup,group_offset:groupOffset});const view=extract(result);
if(state?.status==="loading"&&view?.status==="review"){savedChoices(view);if(view.category!==category||view.query!==query||view.offset!==offset||view.similar_group!==similarGroup||view.group_offset!==groupOffset)result=await call("scan_status",{category,offset,query,similar_group:similarGroup,group_offset:groupOffset});}
accept(result)}
function schedule(){clearTimeout(timer);if(!state||state.closed)return;const active=["scanning","loading","previewing","moving"].includes(state.status), ai=["pending","investigating"].includes(state.ai_status);
if(active||ai)timer=setTimeout(async()=>{try{await refresh();error("")}catch(e){error("Connection interrupted. Retrying scan status… "+(e.message||String(e)));schedule()}},active?1500:4000);
if(state.status==="review"&&state.ai_status==="pending"&&state.ai_auto_request&&!aiSent){aiSent=true;void guard(requestAI)} }
async function requestAI(){await call("request_ai_review");const prompt=`Freeup Space widget requested its Deep Scan + AI review for session ${state.session_id}. Call get_investigation with this session_id; assess the bounded metadata-only packet, then call record_investigation to display advisory findings in the widget. Do not read file contents, perform cleanup, or click confirmation controls.`;
try{if(bridgeReady)await rpc("ui/message",{role:"user",content:[{type:"text",text:prompt}]});else await window.openai.sendFollowUpMessage({prompt})}
catch(e){aiSent=false;throw new Error("AI review could not be sent to Codex. Use Retry AI review. "+e.message)}}
function stat(value,label){return append(el("div",undefined,"stat"),el("strong",value),el("span",label))}
function render(){if(!state)return;app.replaceChildren();
if(needsReconnect){append(app,el("p",restoring?"Reconnecting to your scan…":"Reconnect to load your scan’s current status.","muted"));if(!restoring)app.append(button("Reconnect",reconnect));return}
if(state.closed){append(app,el("h2","Widget closed"),el("p","Your scan and selections are saved.","muted"),button("Reopen saved results",reopen,true));return;}
app.append(append(el("div",undefined,"toolbar"),button("Close widget",closeWidget)));
if(state.status==="choose-mode"||state.status==="cancelled"||state.status==="error")return renderModes();
if(["scanning","loading","previewing","moving"].includes(state.status))return renderProgress();
if(state.status==="done")return renderDone();
if(state.status==="preview"&&!editing)return renderPreview();
renderReview();}
function renderSaved(){if(!state.saved_scans?.length)return;const d=el("details");d.append(el("summary","Saved scans"));for(const run of state.saved_scans){d.append(button(`${new Date(run.saved_at*1000).toLocaleString()} · ${run.mode} · ${run.run_id}`,async()=>{await saveChoices();selected.clear();category="";query="";offset=0;similarGroup="";groupOffset=0;editing=false;accept(await call("open_saved_scan",{run_id:run.run_id}));}));}app.append(d);}
function renderModes(){renderSaved();append(app,el("h2",state.status==="cancelled"?"Scan cancelled":"Find room for what’s next"),el("p","Choose how thoroughly to scan your storage.","muted"));
if(state.error)append(app,el("div",state.error,"error"));
if(state.can_resume)append(app,el("p","Your inventory was saved. Resume analysis without scanning those folders again.","notice"),button("Resume saved scan",async()=>{selected.clear();editing=false;aiSent=false;busy=true;render();try{accept(await call("resume_scan",{request_id:crypto.randomUUID()}))}finally{busy=false;render()}},true));
const modes=el("div",undefined,"modes");for(const [id,name,description] of [["quick","Quick Scan","Fast checks of common caches and clutter."],["deep","Deep Scan","Broader inventory, duplicates, older files and app storage."],["deep-ai","Deep Scan + AI","Deep Scan plus Codex review of unclear findings. More time and AI usage."]]){const label=el("label",undefined,"mode"),input=el("input");input.type="radio";input.name="mode";input.value=id;input.checked=mode===id;input.onchange=()=>{mode=id};append(label,input,el("strong",name),el("span",description));modes.append(label)}
append(app,modes);const detail=el("details"),input=el("textarea");input.rows=2;input.placeholder="Optional: one absolute folder path per line";input.value=roots;input.setAttribute("aria-label","Folders to scan");input.oninput=()=>roots=input.value;append(detail,el("summary","Choose specific folders"),el("p","Leave blank for the scan’s default locations.","muted"),input);append(app,detail,
el("p","Deep + AI shares a bounded set of file names, paths, sizes and timestamps with Codex. File contents are not included.","notice"),
button("Start scan",async()=>{await saveQueue;selected.clear();category="";offset=0;query="";similarGroup="";groupOffset=0;editing=false;aiSent=false;busy=true;render();const request_id=crypto.randomUUID();try{accept(await call("start_scan",{mode,request_id,paths:roots.split(/\r?\n/).map(p=>p.trim()).filter(Boolean)}))}finally{busy=false;render()}},true));}
function renderProgress(){if(state.status==="loading"){append(app,el("h2","Loading saved results"),el("p","Opening the saved report. No rescan is running.","muted"),el("progress"));return;}const scanning=state.status==="scanning", moving=state.status==="moving";
const p=state.progress||{}, staged=scanning&&typeof p.processed==="number", now=Date.now()/1000;
append(app,el("h2",scanning?(state.mode==="quick"?"Quick Scan":state.mode==="deep"?"Deep Scan":"Deep Scan + AI"):moving?"Moving selected items to Trash":"Checking your selection"),
el("p",scanning?p.phase||"Starting":moving?"Each item is revalidated before its recoverable move.":"Checking that the selected files still match the scan.","muted"));
const bar=el("progress");bar.setAttribute("aria-label",scanning?p.phase||"Scan progress":"Operation progress");
if(staged&&Number.isFinite(p.total)&&p.total>0){bar.max=p.total;bar.value=Math.min(p.processed,p.total)}
app.append(bar);
if(scanning){
 const totalTime=`${Math.max(0,Math.floor(now-state.started_at))}s`;
 if(staged){
  const count=p.unit==="bytes"?bytes(p.processed):p.processed.toLocaleString()+(Number.isFinite(p.total)?` / ${p.total.toLocaleString()}`:"");
  append(app,append(el("div",undefined,"stats"),stat(count,p.unit==="bytes"?"data processed":`${p.unit||"items"} processed`),stat(`${Math.max(0,Math.floor(now-p.phase_started_at))}s`,"this stage"),stat(totalTime,"total elapsed")));
  if(p.files_scanned!==undefined)app.append(el("p",`Inventory complete · ${p.files_scanned.toLocaleString()} files${p.bytes_scanned!==undefined?` · ${bytes(p.bytes_scanned)} inventoried`:""}`,"notice"));
  const since=Math.max(0,Math.floor(now-p.updated_at));
  if(since>=10)app.append(el("p",`Last progress update ${since}s ago.`,"muted"));
 }else append(app,append(el("div",undefined,"stats"),stat(String(p.files_scanned||0),"files checked"),stat(bytes(p.bytes_scanned),"bytes examined"),stat(totalTime,"elapsed")));
 if(p.message)app.append(el("p",p.message,"muted"));
 if(p.current_path&&!staged)app.append(el("p",p.current_path,"path"));
 append(app,el("p",`${p.errors||0} access errors · Results will include scan coverage and exclusions.`,"notice"),button("Cancel scan",async()=>accept(await call("cancel_scan"))));
}}

function item(candidate,check=true){const row=el("div",undefined,"item"),main=el("div",undefined,"item-main"),id="candidate-"+candidate.candidate_id;
if(check){const input=el("input");input.type="checkbox";input.id=id;input.checked=selected.has(candidate.candidate_id);input.disabled=!candidate.actionable||busy;input.onchange=()=>guard(async()=>{if(input.checked)selected.set(candidate.candidate_id,candidate);else selected.delete(candidate.candidate_id);renderFooter();await saveChoices();});row.append(input)}
const name=el(check?"label":"strong",candidate.path.split(/[\\/]/).filter(Boolean).at(-1)||candidate.path);if(check)name.htmlFor=id;
append(main,name,el("div",candidate.path,"path"),el("span",`${candidate.candidate_id} · ${candidate.actionable?candidate.risk+" risk":"Report only — not selectable"}`,"risk "+candidate.risk));
if(candidate.retained_path)main.append(el("div","Keep: "+candidate.retained_path,"reason"));
if(candidate.reasons?.length){const d=el("details"),summary=el("summary","Why this item?");d.append(summary);for(const r of candidate.reasons)d.append(el("div",r,"reason"));main.append(d)}
if(check&&candidate.similar_group_id){const b=button(`Select similar (${candidate.similar_group_count})`,()=>selectSimilar(candidate.similar_group_id),false,!candidate.similar_group_count);b.className="similar-action";b.title=`Select every eligible file in ${candidate.similar_group_label}, across all folders and pages`;main.append(b)}
append(row,main,el("div",candidate.actionable?bytes(candidate.reclaimable_bytes):"—","size"));return row}
function renderCoverage(){const c=state.coverage||{},d=el("details"),lines=[];d.append(el("summary","Scan coverage and exclusions"));
if(c.status)lines.push("Coverage: "+c.status);if(c.time_budget_exhausted)lines.push("Quick Scan reached its time budget; some locations were not scanned.");
if(c.scope)lines.push(c.scope);if(c.duplicates)lines.push("Duplicate analysis: "+c.duplicates);
if(c.duplicate_scope)lines.push("Duplicates use the highest-value folders within file, byte and time budgets; not every file is compared.");
if(c.old_file_months)lines.push("Older files means not modified for 12 months, not proven unused.");
if(c.excluded_count)lines.push(`${c.excluded_count} paths excluded.`);if(c.skipped_links)lines.push(`${c.skipped_links} linked paths skipped.`);
for(const text of lines)d.append(el("p",text,"muted"));for(const path of c.skipped_paths||[])d.append(el("div",path,"path"));app.append(d);}
function renderSimilarGroups(){
if(!state.similar_group_count)return;
append(app,el("h2","Similar-name groups"),el("p","Matching names and related formats across the entire scan. The # marks a number; separators and copy suffixes may differ. Similar names do not mean identical content.","muted"));
const list=el("div",undefined,"similar-groups");
for(const group of state.similar_groups){const card=el("section",undefined,"similar-card");card.setAttribute("aria-label",group.label);
append(card,append(el("div",undefined,"row"),el("h3",group.label),el("strong",bytes(group.bytes))),el("p",`${group.count} files · ${group.actionable_count} selectable · ${group.extensions.join(", ")}`,"muted"),append(el("div",undefined,"toolbar"),button(`Select all ${group.actionable_count} files`,()=>selectSimilar(group.group_id),false,!group.actionable_count),button("Show group files",()=>showGroup(group)),button("Clear group",()=>selectSimilar(group.group_id,"clear"))));list.append(card);}
app.append(list);
if(state.similar_group_count>20)app.append(append(el("div",undefined,"toolbar"),button("Previous groups",async()=>{groupOffset-=20;await changePage()},false,groupOffset===0),el("small",`${groupOffset+1}–${Math.min(groupOffset+20,state.similar_group_count)} of ${state.similar_group_count} groups`),button("Next groups",async()=>{groupOffset+=20;await changePage()},false,groupOffset+20>=state.similar_group_count)));
