<body><main><header><div class="brand"><div class="mark" aria-hidden="true">◫</div><div><h1>Freeup Space</h1><small>Choose what stays. Clear what you no longer need.</small></div></div><span class="badge">Recoverable cleanup</span></header><div id="error" role="alert" hidden></div><div id="app" aria-live="polite"><p class="muted">Connecting to Freeup Space…</p></div></main>
<script>

// A tool notification can replay the original open_widget snapshot after remount.

function restore(result){const view=extract(result);if(!view)return;

void reconnect();}
async function reconnect(){if(!state||restoring||!(bridgeReady||window.openai?.callTool))return;
restoring=true;needsReconnect=true;clearTimeout(timer);render();
try{await refresh();needsReconnect=false;error("")}
catch(e){needsReconnect=true;clearTimeout(timer);error(e.message||String(e))}
finally{restoring=false;render()}}
window.addEventListener("pageshow",()=>void reconnect());
document.addEventListener("visibilitychange",()=>{if(!document.hidden)void reconnect()});
window.addEventListener("message",event=>{if(event.source!==parent)return;const data=event.data;if(!data||data.jsonrpc!=="2.0")return;
if(data.id!==undefined&&pending.has(data.id)){const p=pending.get(data.id);pending.delete(data.id);clearTimeout(p.timeout);data.error?p.reject(new Error(data.error.message)):p.resolve(data.result);return}
if(data.method==="ui/notifications/tool-result")restore(data.params);
if(data.method==="ui/notifications/tool-cancelled")error("The host cancelled this request. Your files have not been approved for a new operation.");
if(data.method==="ui/resource-teardown"){clearTimeout(timer);parent.postMessage({jsonrpc:"2.0",id:data.id,result:{}},"*")}
});
window.addEventListener("openai:set_globals",event=>{const g=event.detail?.globals;restore(g?.toolResponseMetadata);if(!state)restore(window.openai?.toolResponseMetadata)});
async function call(name,args={}){const params={...args};if(state&&name!=="open_widget")Object.assign(params,{session_id:state.session_id,key:state.key});
const result=bridgeReady?await rpc("tools/call",{name,arguments:params}):await window.openai.callTool(name,params);
if(result?.isError)throw new Error(result.content?.filter(c=>c.type==="text").map(c=>c.text).join("\n")||"Operation failed");return result}

if(active||ai)timer=setTimeout(()=>guard(refresh),active?1500:4000);
if(state.status==="review"&&state.ai_status==="pending"&&!aiSent){aiSent=true;void guard(requestAI)} }

try{if(bridgeReady)await rpc("ui/message",{role:"user",content:[{type:"text",text:prompt}]});else await window.openai.sendFollowUpMessage({prompt})}
catch(e){aiSent=false;throw new Error("AI review could not be sent to Codex. Use Retry AI review. "+e.message)}}
function stat(value,label){return append(el("div",undefined,"stat"),el("strong",value),el("span",label))}

if(needsReconnect){append(app,el("p",restoring?"Reconnecting to your scan…":"Reconnect to load your scan’s current status.","muted"));if(!restoring)app.append(button("Reconnect",reconnect));return}
if(state.status==="choose-mode"||state.status==="cancelled"||state.status==="error")return renderModes();
if(["scanning","previewing","moving"].includes(state.status))return renderProgress();

if(state.status==="preview"&&!editing)return renderPreview();
renderReview();}
function renderModes(){append(app,el("h2",state.status==="cancelled"?"Scan cancelled":"Find room for what’s next"),el("p","Choose how thoroughly to scan your storage.","muted"));
if(state.error)append(app,el("div",state.error,"error"));
const modes=el("div",undefined,"modes");for(const [id,name,description] of [["quick","Quick Scan","Fast checks of common caches and clutter."],["deep","Deep Scan","Broader inventory, duplicates, older files and app storage."],["deep-ai","Deep Scan + AI","Deep Scan plus Codex review of unclear findings. More time and AI usage."]]){const label=el("label",undefined,"mode"),input=el("input");input.type="radio";input.name="mode";input.value=id;input.checked=mode===id;input.onchange=()=>{mode=id};append(label,input,el("strong",name),el("span",description));modes.append(label)}
append(app,modes);const detail=el("details"),input=el("textarea");input.rows=2;input.placeholder="Optional: one absolute folder path per line";input.value=roots;input.setAttribute("aria-label","Folders to scan");input.oninput=()=>roots=input.value;append(detail,el("summary","Choose specific folders"),el("p","Leave blank for the scan’s default locations.","muted"),input);append(app,detail,
el("p","Deep + AI shares a bounded set of file names, paths, sizes and timestamps with Codex. File contents are not included.","notice"),
button("Start scan",async()=>{selected.clear();category="";offset=0;query="";editing=false;aiSent=false;busy=true;render();const request_id=crypto.randomUUID();try{accept(await call("start_scan",{mode,request_id,paths:roots.split(/\r?\n/).map(p=>p.trim()).filter(Boolean)}))}finally{busy=false;render()}},true));}
function renderProgress(){const scanning=state.status==="scanning", moving=state.status==="moving";
append(app,el("h2",scanning?(state.mode==="quick"?"Quick Scan":state.mode==="deep"?"Deep Scan":"Deep Scan + AI"):moving?"Moving selected items to Trash":"Checking your selection"),
el("p",scanning?state.progress.phase||"Starting":moving?"Each item is revalidated before its recoverable move.":"Checking that the selected files still match the scan.","muted"),el("div",undefined,"progress-line"));
if(scanning){const p=state.progress;append(app,append(el("div",undefined,"stats"),stat(String(p.files_scanned||0),"files checked"),stat(bytes(p.bytes_scanned),"bytes examined"),stat(`${Math.max(0,Math.floor((Date.now()/1000-state.started_at)))}s`,"elapsed")));if(p.message)app.append(el("p",p.message,"muted"));if(p.current_path)app.append(el("p",p.current_path,"path"));append(app,el("p",`${p.errors||0} access errors · Results will include scan coverage and exclusions.`,"notice"),button("Cancel scan",async()=>accept(await call("cancel_scan"))))}}
function item(candidate,check=true){const row=el("div",undefined,"item"),main=el("div",undefined,"item-main"),id="candidate-"+candidate.candidate_id;
if(check){const input=el("input");input.type="checkbox";input.id=id;input.checked=selected.has(candidate.candidate_id);input.disabled=!candidate.actionable;input.onchange=()=>{if(input.checked)selected.set(candidate.candidate_id,candidate);else selected.delete(candidate.candidate_id);renderFooter()};row.append(input)}
const name=el(check?"label":"strong",candidate.path.split(/[\\/]/).filter(Boolean).at(-1)||candidate.path);if(check)name.htmlFor=id;
append(main,name,el("div",candidate.path,"path"),el("span",`${candidate.candidate_id} · ${candidate.actionable?candidate.risk+" risk":"Report only — not selectable"}`,"risk "+candidate.risk));
if(candidate.retained_path)main.append(el("div","Keep: "+candidate.retained_path,"reason"));
if(candidate.reasons?.length){const d=el("details"),summary=el("summary","Why this item?");d.append(summary);for(const r of candidate.reasons)d.append(el("div",r,"reason"));main.append(d)}
append(row,main,el("div",candidate.actionable?bytes(candidate.reclaimable_bytes):"—","size"));return row}
function renderCoverage(){const c=state.coverage||{},d=el("details"),lines=[];d.append(el("summary","Scan coverage and exclusions"));
if(c.status)lines.push("Coverage: "+c.status);if(c.time_budget_exhausted)lines.push("Quick Scan reached its time budget; some locations were not scanned.");
if(c.scope)lines.push(c.scope);if(c.duplicates)lines.push("Duplicate analysis: "+c.duplicates);
if(c.duplicate_scope)lines.push("Duplicates use the highest-value folders within file, byte and time budgets; not every file is compared.");
if(c.old_file_months)lines.push("Older files means not modified for 12 months, not proven unused.");
if(c.excluded_count)lines.push(`${c.excluded_count} paths excluded.`);if(c.skipped_links)lines.push(`${c.skipped_links} linked paths skipped.`);
for(const text of lines)d.append(el("p",text,"muted"));for(const path of c.skipped_paths||[])d.append(el("div",path,"path"));app.append(d);}
function renderReview(){append(app,append(el("div",undefined,"stats"),stat(bytes(state.reclaimable_bytes),"estimated cleanup"),stat(String(state.actionable_count),"selectable items"),stat(String(state.categories.length),"categories")),
el("h2","Review by category"),el("p","Expand a category to choose individual items. Nothing is selected automatically.","muted"));
const search=el("input");search.type="search";search.value=query;search.placeholder="Search item names or paths";search.setAttribute("aria-label","Search cleanup items");search.onchange=()=>guard(async()=>{query=search.value;offset=0;await refresh()});app.append(search);
const groups=el("div",undefined,"categories");for(const group of state.categories){const container=el("section",undefined,"category"),toggle=el("button",undefined,"category-toggle"),open=category===group.category;toggle.type="button";toggle.setAttribute("aria-expanded",String(open));
append(toggle,el("span",open?"▾":"▸"),append(el("span",undefined,"grow"),el("strong",title(group.category)),el("small",`${group.count} items · ${group.actionable_count} selectable`)),el("span",bytes(group.bytes),"size"));toggle.onclick=()=>guard(async()=>{category=open?"":group.category;offset=0;await refresh()});container.append(toggle);
if(open){const items=el("div",undefined,"items"),toolbar=el("div",undefined,"toolbar");append(toolbar,button("Select visible items",()=>{for(const c of state.candidates)if(c.actionable)selected.set(c.candidate_id,c);render()}),button("Clear visible",()=>{for(const c of state.candidates)selected.delete(c.candidate_id);render()}),el("small",`${state.filtered_count} matching items`));items.append(toolbar);
for(const c of state.candidates)items.append(item(c));if(!state.candidates.length)items.append(el("p","No matching items.","muted"));
if(state.filtered_count>50)append(items,append(el("div",undefined,"toolbar"),button("Previous",async()=>{offset-=50;await refresh()},false,offset===0),el("small",`${offset+1}–${Math.min(offset+50,state.filtered_count)} of ${state.filtered_count}`),button("Next",async()=>{offset+=50;await refresh()},false,offset+50>=state.filtered_count)));container.append(items)}groups.append(container)}
app.append(groups);if(!state.candidate_count)app.append(el("p","No cleanup candidates were found in this scan.","notice"));renderCoverage();renderAI();const footer=el("div",undefined,"selection");footer.id="selection";app.append(footer);renderFooter();}
function renderFooter(){const footer=$("#selection");if(!footer)return;footer.replaceChildren();const total=[...selected.values()].reduce((n,c)=>n+c.reclaimable_bytes,0);append(footer,append(el("div",undefined,"row"),append(el("div"),el("strong",`${selected.size} selected · ${bytes(total)}`),el("small","Moves to Trash / Recycle Bin. Space may not be freed immediately.")),button("Preview selection",async()=>{editing=false;accept(await call("preview_selection",{ids:[...selected.keys()],plan_digest:state.plan_digest}))},true,selected.size===0||selected.size>500)),append(el("div",undefined,"toolbar"),button("Clear selection",()=>{selected.clear();render()}),button("New scan",()=>{state.status="choose-mode";render()})));if(selected.size>500)footer.append(el("p","Choose at most 500 items per cleanup.","notice"));}
function renderAI(){if(!state.ai_status)return;const box=el("section",undefined,"panel ai");append(box,el("h2","AI review"),el("p",({pending:"Requesting Codex review…",investigating:"Codex is reviewing the metadata…",complete:"Review complete",partial:"Review partially complete","nothing-to-investigate":"No unclear findings in this batch"})[state.ai_status]||state.ai_status,"muted"));
if(["pending","investigating"].includes(state.ai_status))append(box,el("p",`${state.ai_finding_count} directories in the bounded metadata packet. Suggestions are advisory.`,"notice"),button("Retry AI review",requestAI));
for(const f of state.ai_notes?.findings||[]){const n=el("div",undefined,"ai-finding");append(n,el("h3",f.finding_id+" · "+f.suggested_action.replaceAll("-"," ")),el("div",f.directory||"","path"),el("p",f.assessment),el("p","Evidence: "+f.evidence,"muted"),el("p","Uncertainty: "+f.uncertainty,"muted"));box.append(n)}

function renderPreview(){const p=state.preview;append(app,el("h2","Confirm your cleanup"),el("p",`${p.ids.length} items · ${bytes(p.reclaimable_bytes)} estimated size`,"muted"));const list=el("div",undefined,"preview-list");for(const c of p.candidates)list.append(item(c,false));app.append(list);

append(app,el("p","These exact items will be moved to Trash / Recycle Bin, where you can restore them. This widget does not empty Trash or permanently delete files.","notice"),append(el("div",undefined,"row spacer"),button("Back to selection",async()=>{editing=true;await refresh()}),button("Confirm move to Trash",async()=>{busy=true;render();try{accept(await call("confirm_trash",{token:p.token}))}finally{busy=false;render()}},true,p.blocked.length>0||Date.now()/1000>p.expires_at)));}

(async()=>{try{await rpc("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"Freeup Space",version:"0.1.0"},appCapabilities:{}});bridgeReady=true;parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*");}catch(e){if(!window.openai?.callTool)error("This host could not connect the interactive widget. Reopen Freeup Space in a supported desktop task.")}

})();
