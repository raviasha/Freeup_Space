name: Build installers

on:
  push:
    branches: [main, 'codex/self-contained-setup', 'codex/windows-setup-detection']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Setup (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-15
            label: macOS-Apple-Silicon
          - os: macos-15-intel
            label: macOS-Intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r installer/requirements-build.txt pytest
      - name: Verify Tk is available
        run: python -c 'import tkinter; print(tkinter.TkVersion)'
      - name: Run installer and runtime tests
        run: python -m pytest installer/tests plugins/freeup-space/tests/test_runtime.py -q
      - name: Build and check frozen runtime and setup
        run: python -m installer.build
      - uses: actions/upload-artifact@v4
        with:
          name: Freeup-Space-${{ matrix.label }}
          path: |
            build/setup/Freeup-Space-*.exe
            build/setup/Freeup-Space-*.zip
            build/setup/Freeup-Space-*.sha256
            build/setup/*-check.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installer downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Install Freeup Space without setting up Python, pip, Git, or PATH.

          1. Install and open the Codex desktop app first.
          2. Download the Windows .exe or the macOS ZIP for your Mac (Apple Silicon or Intel).
          3. Open Freeup Space Setup and click Install / Update / Repair.
          4. Open a new Codex task and ask “Open Freeup Space”.

          Rerun this installer to repair this version. Use Check for updates to get the latest installer. Setup verifies its bundled runtime and widget, and never cleans your files.

          These builds are not publisher-signed or notarized. Windows or macOS may display a security prompt or block opening. Follow your organization's policy; do not disable OS security protections. Managed devices may require an administrator-approved signed build.
          EOF
          gh release create "$RELEASE_TAG" installers/Freeup-Space-* --title "Freeup Space $RELEASE_TAG" --notes-file release-notes.md --verify-tag
